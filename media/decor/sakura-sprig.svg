<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- A shorter sprig, for the smaller corners. -->
  <defs>
    <g id="petal">
      <path d="M0 0C-7-4-10-12-5-16.5c2.5-2.3 4.5-1.5 5 1 .5-2.5 2.5-3.3 5-1C10-12 7-4 0 0Z"
            fill="#f6c8d4" stroke="#e9a8ba" stroke-width="0.6"/>
    </g>
    <g id="blossom">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle r="2.6" fill="#f3dca6"/>
      <g stroke="#e0b083" stroke-width="0.8" stroke-linecap="round">
        <path d="M0 0 -4-5M0 0 4-5M0 0 5 3M0 0-5 3M0 0 0-6"/>
      </g>
    </g>
    <g id="bud">
      <circle r="3.4" fill="#eeb3c3"/>
      <circle r="3.4" cy="-1.2" fill="#f7d2dc"/>
    </g>
  </defs>

  <g fill="none" stroke="#6f5248" stroke-linecap="round">
    <path d="M-12-10C22 12 54 30 86 42c28 11 56 14 84 8" stroke-width="5.4"/>
    <path d="M86 42c4 16 3 30-4 43" stroke-width="3.2"/>
    <path d="M140 52c9-14 21-23 36-27" stroke-width="2.8"/>
  </g>

  <g>
    <use href="#blossom" transform="translate(80 92) rotate(12) scale(.82)"/>
    <use href="#blossom" transform="translate(176 24) rotate(-6) scale(.76)"/>
    <use href="#blossom" transform="translate(168 54) rotate(18) scale(.62)"/>
    <use href="#bud" transform="translate(86 66) scale(1)"/>
    <use href="#bud" transform="translate(148 44) scale(.85)"/>
  </g>
</svg>
